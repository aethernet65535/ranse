[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ranse"
version = "0.1.0"
description = "Fill e-RPH Excel templates from weekly timetables (Malaysia)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]

[project.scripts]
ranse = "ranse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

# The wheel carries the framework only: plugins are local directories a user
# drops into ./plugins, never installed packages (docs/DESIGN.md S8).
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src", "plugins"]
