# ============================================================
# jadual-minggu.yaml —  minggu ↔ jadual (siri) lookup table
# ============================================================
# This file answers two questions:
#   1. Which week is today (--date, default: this week's Sunday)? → minggu table
#   2. Which timetable (siri) does that week use?                → jadual_siri / jadual
#
# Usage (referenced by the profile's inputs.jadual; the CLI only overrides date/week):
#   ranse fill --profile profiles/ali-bin-abu/profile.yaml
#   ranse fill --profile profiles/ali-bin-abu/profile.yaml --date 2026-09-20
#
# Notes:
#   - The minggu table is generated from the DATA sheet (TARIKH → MINGGU) in
#     M18.xlsx; each record takes effect on its start date (a Sunday) until the
#     next record. If the school calendar changes, just add/remove/edit records.
#   - Holiday weeks are marked with cuti; hitting such a week reports an error.
#   - jadual_siri is the table you fill in later: week N → siri number. You can
#     also skip it and put siri directly in the minggu record (higher priority).
# ============================================================

# siri number → timetable file (paths are relative to the repo root; absolute paths also work)
jadual:
  1: assets/timetable/jadual-waktu-2026-siri-1.xlsx
  2: assets/timetable/jadual-waktu-2026-siri-2.xlsx
  3: assets/timetable/jadual-waktu-2026-siri-3.xlsx
  4: assets/timetable/jadual-waktu-2026-siri-4.xlsx
  5: assets/timetable/jadual-waktu-2026-siri-5.xlsx
  6: assets/timetable/jadual-waktu-2026-siri-6.xlsx
  7: assets/timetable/jadual-waktu-2026-siri-7.xlsx

# minggu → siri (filled in from the JADUAL SIRI table in /tmp/timetable.md)
# Mapping:
#   siri 1: M1-M5    siri 2: M6      siri 3: M7-M9    siri 4: M10-M14
#   siri 5: M15-M24  siri 6: M25-M28  siri 7: M29-M44
# Note: the timetable files for siri 2-6 are not in jadual: yet, so those weeks
#       report a missing-file error.
